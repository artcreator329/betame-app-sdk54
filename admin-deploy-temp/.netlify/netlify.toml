functionsDirectory = "/Users/christopher/Desktop/Project/betame-app/admin-deploy-temp/netlify/functions"
functionsDirectoryOrigin = "ui"
redirectsOrigin = "config"
plugins = []

[functions]

[functions."*"]

[build]
publish = "/Users/christopher/Desktop/Project/betame-app/admin-deploy-temp/dist"
publishOrigin = "config"
commandOrigin = "config"
base = "/Users/christopher/Desktop/Project/betame-app/admin-deploy-temp"
command = "npm run build:web && cp -r public/* dist/ 2>/dev/null || true"
functions = "/Users/christopher/Desktop/Project/betame-app/admin-deploy-temp/netlify/functions"

[build.environment]
NODE_VERSION = "20"
EXPO_PUBLIC_ADMIN_ONLY = "true"

[build.processing]
skip_processing = false

[build.processing.css]
bundle = true
minify = true

[build.processing.html]
pretty_urls = true

[build.processing.images]
compress = true

[build.processing.js]
bundle = true
minify = true

[build.services]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

