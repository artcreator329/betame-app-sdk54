[build]
  command = "npm run build:web && cp -r public/* dist/ 2>/dev/null || true && mkdir -p dist/.well-known && cp -r public/.well-known/* dist/.well-known/ 2>/dev/null || true && mkdir -p dist/auth && cp web/auth/verify-email-universal.html dist/auth/ 2>/dev/null || true && cp web/smart-service-link.html dist/ 2>/dev/null || true && mkdir -p dist/share && cp web/share/service.html dist/share/ 2>/dev/null || true"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Note: _redirects and _headers files will be copied from public/ folder
# This provides more flexibility than inline configuration

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/auth/verify-server"
to = "/.netlify/functions/verify-server"
status = 200

# Serve .well-known directory for universal links
[[headers]]
for = "/.well-known/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Content-Type = "application/json"