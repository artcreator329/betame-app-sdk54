<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    
    <title>Install BetaMe - Earn Extra Income</title>
    <meta name="description" content="Join BetaMe and earn extra income by listing your service. Download the app now!" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: slideInUp 0.6s ease-out 0.2s forwards;
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.8);
            animation: logoPop 0.6s ease-out 0.4s forwards;
        }
        
        @keyframes logoPop {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.6s ease-out 0.6s forwards;
        }
        
        .subtitle {
            color: #666;
            margin: 0 0 30px 0;
            font-size: 16px;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.6s ease-out 0.8s forwards;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .install-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease-out 1s forwards;
            position: relative;
            overflow: hidden;
        }
        
        .install-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .install-button:hover::before {
            left: 100%;
        }
        
        .install-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .install-button:active {
            transform: translateY(-1px);
            transition: transform 0.1s ease;
        }
        
        .install-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .store-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            vertical-align: middle;
            transition: transform 0.2s ease;
        }
        
        .install-button:hover .store-icon {
            transform: scale(1.1);
        }
        
        .fallback-text {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.6s ease-out 1.2s forwards;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.4s ease-out forwards;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Page transition animations */
        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 9999;
            transform: translateX(-100%);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .page-transition.active {
            transform: translateX(0);
        }
        
        .page-transition.complete {
            transform: translateX(100%);
        }
        
        /* Responsive animations */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .logo {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .subtitle {
                font-size: 14px;
            }
        }
        
        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Page transition overlay -->
    <div class="page-transition" id="pageTransition"></div>
    
    <div class="container">
        <div class="logo">BM</div>
        <h1>Install BetaMe</h1>
        <p class="subtitle">Join BetaMe and earn extra income by listing your service</p>
        
        <button id="installButton" class="install-button" onclick="installApp()">
            <span id="buttonText">Install BetaMe</span>
        </button>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Redirecting to app store...</p>
        </div>
        
        <p class="fallback-text">
            If the app doesn't open automatically, please use the button above to install BetaMe from your app store.
        </p>
    </div>

    <script>
        // Get referral code from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const referralCode = urlParams.get('ref');
        
        // App store URLs (replace with actual URLs when app is published)
        const APP_STORE_URL = 'https://apps.apple.com/app/betame/id123456789'; // Replace with actual App Store URL
        const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.betame.app'; // Replace with actual Play Store URL
        
        // Deep link to open app if installed
        const DEEP_LINK = `betame://signup${referralCode ? `?ref=${referralCode}` : ''}`;
        
        function detectPlatform() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return 'ios';
            } else if (/android/i.test(userAgent)) {
                return 'android';
            } else {
                return 'web';
            }
        }
        
        function showPageTransition() {
            const transition = document.getElementById('pageTransition');
            transition.classList.add('active');
            
            setTimeout(() => {
                transition.classList.add('complete');
            }, 300);
        }
        
        function installApp() {
            const platform = detectPlatform();
            const button = document.getElementById('installButton');
            const buttonText = document.getElementById('buttonText');
            const loading = document.getElementById('loading');
            
            // Add button click animation
            button.style.transform = 'scale(0.95)';
            setTimeout(() => {
                button.style.transform = '';
            }, 150);
            
            // Show loading state with smooth transition
            button.style.opacity = '0';
            button.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                button.style.display = 'none';
                loading.classList.add('show');
            }, 200);
            
            // Try to open app first, then redirect to store if it fails
            if (platform === 'ios' || platform === 'android') {
                // Try to open the app with deep link
                window.location.href = DEEP_LINK;
                
                // If app doesn't open within 2 seconds, redirect to store
                setTimeout(() => {
                    showPageTransition();
                    setTimeout(() => {
                        if (platform === 'ios') {
                            window.location.href = APP_STORE_URL;
                        } else if (platform === 'android') {
                            window.location.href = PLAY_STORE_URL;
                        }
                    }, 300);
                }, 2000);
            } else {
                // For web users, show a message with smooth animation
                setTimeout(() => {
                    button.style.display = 'block';
                    button.style.opacity = '1';
                    button.style.transform = 'translateY(0)';
                    loading.classList.remove('show');
                    buttonText.textContent = 'Please use your mobile device';
                    button.disabled = true;
                }, 500);
            }
        }
        
        // Auto-trigger installation on page load for mobile devices
        window.onload = function() {
            const platform = detectPlatform();
            if (platform === 'ios' || platform === 'android') {
                // Small delay to let the page load and animations complete
                setTimeout(installApp, 1000);
            }
        };
        
        // Track referral if code is present
        if (referralCode) {
            // You can add analytics tracking here
            console.log('Referral code detected:', referralCode);
        }
        
        // Add smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';
    </script>
</body>
</html>
