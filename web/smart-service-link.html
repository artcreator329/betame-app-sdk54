<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening BetaMe...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: #007AFF;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007AFF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        
        p {
            color: #666;
            margin-bottom: 20px;
        }
        
        .fallback-link {
            display: inline-block;
            background: #007AFF;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">B</div>
        <h1>Opening BetaMe...</h1>
        <div class="spinner"></div>
        <p>If the app doesn't open automatically, click below:</p>
        <a href="#" class="fallback-link" id="fallbackLink">Open in Browser</a>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const serviceId = urlParams.get('serviceId');
        const deepLink = urlParams.get('deepLink');
        
        // Set up fallback link
        const fallbackUrl = `https://betame.com.my/share/service?serviceId=${serviceId}&${urlParams.toString()}`;
        document.getElementById('fallbackLink').href = fallbackUrl;
        
        // Detect platform
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        const isMobile = isIOS || isAndroid;
        
        function tryOpenApp() {
            if (deepLink && isMobile) {
                // Try to open the app with deep link
                window.location.href = deepLink;
                
                // Fallback to web version after delay
                setTimeout(() => {
                    window.location.href = fallbackUrl;
                }, 2500);
            } else {
                // Desktop or no deep link - go to web version
                window.location.href = fallbackUrl;
            }
        }
        
        // Start the process
        setTimeout(tryOpenApp, 1000);
    </script>
</body>
</html>
